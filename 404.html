<script>
/* short addresses: /watch/<title id> and /w/<title id> open the title on the free-watch page */
(function () {
  var p = location.pathname.slice("/".length), m = /^(?:watch|w)\/(.+?)\/?$/.exec(p);
  if (m) { location.replace('/watch/?id=' + encodeURIComponent(decodeURIComponent(m[1])) + location.hash); return; }
  if (/^(home|bayit|%D7%91%D7%99%D7%AA)\/?$/i.test(p)) { location.replace('/'); return; }
})();
</script>
